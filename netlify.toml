[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["public/data/*.json", "public/data/roads.geojson"]

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
